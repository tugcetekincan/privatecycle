name: Android Release

# Build and publish a signed Android APK whenever a version tag is pushed.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    # Use React Native's community CLI autolinking. Expo's default autolinking
    # generates CMake add_subdirectory() entries pointing at each library's
    # build/generated/source/codegen/jni dir, but does not build those library
    # modules, so New Architecture codegen never runs for them and the C++
    # configure step fails. The community autolinker wires the library Gradle
    # projects (and their codegen) correctly. Requires @react-native-community/cli.
    env:
      EXPO_USE_COMMUNITY_AUTOLINKING: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff against the previous tag

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Tune Gradle for CI
        run: |
          # NOTE: do not enable the Gradle build cache here. node_modules is
          # reinstalled fresh by `npm ci` every run, which wipes each library's
          # build/generated/source/codegen/jni output. A cached "UP-TO-DATE"
          # state then skips React Native codegen, so CMake fails to find those
          # generated dirs at configure time.
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
          } >> android/gradle.properties

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --no-build-cache \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PMYAPP_RELEASE_STORE_FILE=release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/PrivateCycle-${GITHUB_REF_NAME}.apk"

      - name: Generate changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %h %s — %an' "${PREV_TAG}..${CURRENT_TAG}"
            else
              git log --pretty=format:'- %h %s — %an' "${CURRENT_TAG}"
            fi
            echo
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > changelog.md
          echo "----- changelog preview -----"
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrivateCycle-${{ github.ref_name }}.apk
          body_path: changelog.md
