name: Nightly

# Every main push produces a nightly Actions artifact, never a GitHub Release.
# Runs are independent so a later push does not cancel an earlier APK build.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nightly:
    uses: ./.github/workflows/build-android.yml
    with:
      variant: nightly
    secrets: inherit
