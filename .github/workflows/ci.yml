name: CI

# Per-commit verification + signed APK.
#
# Pushes to main run typecheck, Jest, then a signed release APK (arm64-v8a).
# The APK is uploaded as a workflow artifact; publishing a GitHub Release
# stays tag-only in android-release.yml.
#
# Cold (cache-miss) builds are as expensive as a release build (~15 min).
# Warm builds reuse cached Gradle and CMake/native outputs and should be
# much faster. Caches are keyed on package-lock.json / app.json / plugins.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'artifacts/**'
      - 'maestro/**'
      - '.opencode/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Native outputs of the autolinked libraries (reanimated, screens,
      # gesture-handler, expo-modules-core) live inside node_modules, which
      # `npm ci` wipes - so restore them after install, before Gradle runs.
      - name: Restore native library builds
        uses: actions/cache@v4
        with:
          path: |
            node_modules/*/android/build
            node_modules/*/android/.cxx
          key: native-libs-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            native-libs-v1-${{ runner.os }}-

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # android/ is generated fresh on every run. Without these caches Gradle
      # recompiles all New Architecture C++ from scratch (the ~15 min cost).
      - name: Restore app build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/build
            android/app/build
            android/app/.cxx
          key: app-build-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            app-build-v1-${{ runner.os }}-

      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # Materializes codegen dirs for header-only TurboModule libraries before
      # CMake configures (see android-release.yml for the full explanation).
      - name: Generate New Architecture codegen
        working-directory: android
        run: ./gradlew generateCodegenArtifactsFromSchema

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --build-cache \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PMYAPP_RELEASE_STORE_FILE=release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateCycle-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2

      - name: Job summary
        run: |
          {
            echo "## CI"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Artifact: \`PrivateCycle-${GITHUB_SHA}\` (retained 2 days)"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
