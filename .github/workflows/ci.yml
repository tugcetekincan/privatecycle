name: CI

# Per-commit verification + a versioned release.
#
# Every push to main runs typecheck, Jest, then builds two signed release
# APKs and attaches both to one GitHub Release named after the version
# derived from the conventional commits since the previous release
# (scripts/release-version.mjs):
#  - PrivateCycle.apk - stable identity (com.ncan.privatecycle)
#  - PrivateCycle-Nightly.apk - com.ncan.privatecycle.nightly, installs next
#    to the stable app for testing with imported real data
# Rerunning CI for an already-released commit republishes its version.
#
# Caches (see steps below for the reasoning):
#  - native-libs-v2: Gradle/CMake outputs of autolinked libraries and the
#    Gradle plugin included builds (npm ci wipes node_modules, so restore
#    happens after install).
#  - app-build-v1: generated android/ project outputs + Gradle task history.
#  - native-ccache-v1: compiled objects, so native recompiles stay cheap even
#    though a fresh checkout makes Ninja think inputs are newer than outputs.
# Cold builds are ~15 min; warm builds should stay well under 6.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'artifacts/**'
      - 'maestro/**'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: write # publish the versioned release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The NDK toolchain maps NDK_CCACHE to CMAKE_<LANG>_COMPILER_LAUNCHER.
      NDK_CCACHE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 750M
      CCACHE_LOGFILE: /tmp/ccache.log
      # CI checkouts rewrite file timestamps on every run; without these,
      # ccache's direct/preprocessed lookups can miss even for identical code.
      CCACHE_SLOPPINESS: 'time_macros,include_file_mtime,include_file_ctime'
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the release version (tags + commits since the last
          # release) and the changelog are derived from git.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The version this commit will release as: conventional-commit bumps
      # over the commits since the previous release tag. Stamped into both
      # APKs below and used as the release tag after the builds succeed.
      - name: Compute release version
        id: version
        run: |
          git fetch --tags --force origin
          VERSION=$(node scripts/release-version.mjs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure ccache
        run: |
          command -v ccache >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          }
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          # Rolling key: ccache is a mutable cache, and actions/cache never
          # overwrites an existing key, so include the run id and rely on
          # restore-keys to fetch the newest snapshot.
          key: native-ccache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            native-ccache-v1-${{ runner.os }}-

      # Native outputs of the autolinked libraries (reanimated, screens,
      # gesture-handler, expo-modules-core) and of the Gradle plugin included
      # builds live inside node_modules, which `npm ci` wipes - so restore
      # them after install, before Gradle runs.
      - name: Restore native library builds
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/*/android/build
            node_modules/*/android/.cxx
            node_modules/*/android/.gradle
            node_modules/@*/*/android/build
            node_modules/@*/*/android/.cxx
            node_modules/@*/*/android/.gradle
            node_modules/@react-native/gradle-plugin/**/build
            node_modules/@react-native/gradle-plugin/**/.gradle
            node_modules/expo-modules-autolinking/android/**/build
            node_modules/expo-modules-autolinking/android/**/.gradle
            node_modules/expo-modules-core/expo-module-gradle-plugin/**/build
            node_modules/expo-modules-core/expo-module-gradle-plugin/**/.gradle
            node_modules/expo-dev-launcher/expo-dev-launcher-gradle-plugin/**/build
            node_modules/expo-dev-launcher/expo-dev-launcher-gradle-plugin/**/.gradle
          key: native-libs-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            native-libs-v3-${{ runner.os }}-

      - name: Prebuild Android project
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Build-time versionCode (unix minutes): every APK must install over
          # the previous one, and updaters compare versionCodes.
          export ANDROID_VERSION_CODE=$(($(date +%s) / 60))
          npx expo prebuild --platform android --no-install

      # android/ is generated fresh on every run. Without these caches Gradle
      # recompiles all New Architecture C++ from scratch (the ~15 min cost).
      # Restore-only: the matching explicit save runs right after the stable
      # build, before the nightly prebuild wipes android/ (see below).
      - name: Restore app build outputs
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android/.gradle
            android/build
            android/app/build
            android/app/.cxx
          key: app-build-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            app-build-v1-${{ runner.os }}-

      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # The app's CMakeLists add_subdirectory()s every library's generated
      # codegen dir. If the restored caches already contain all of them the
      # explicit codegen pass can be skipped; otherwise materialize them first.
      - name: Check cached codegen outputs
        id: codegen-dirs
        run: |
          autolink=android/app/build/generated/autolinking/src/main/jni/Android-autolinking.cmake
          missing=false
          if [ ! -f "$autolink" ]; then
            missing=true
          else
            while IFS= read -r dir; do
              [ -d "$dir" ] || missing=true
            done < <(sed -n 's/^add_subdirectory("\([^"]*\)".*/\1/p' "$autolink")
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "codegen dirs missing: $missing"

      - name: Generate New Architecture codegen
        if: steps.codegen-dirs.outputs.missing == 'true'
        working-directory: android
        run: ./gradlew generateCodegenArtifactsFromSchema

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --build-cache \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PMYAPP_RELEASE_STORE_FILE=release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      # Stage the stable APK while android/ still holds it: the nightly
      # prebuild below wipes the directory. Both assets are uploaded to one
      # versioned release after the nightly build; workflow artifacts are not
      # used.
      - name: Stage stable APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/PrivateCycle.apk

      # Snapshot the stable build outputs while android/ still holds them: the
      # nightly prebuild below wipes the directory, and the implicit cache save
      # at job end would otherwise store nightly-identity artifacts under the
      # stable app-build key. Skipped when this run restored the exact key
      # (cache entries are immutable, so saving again would be a no-op).
      - name: Save app build outputs (stable)
        if: steps.app-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            android/.gradle
            android/build
            android/app/build
            android/app/.cxx
          key: app-build-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}

      # --- Nightly channel -------------------------------------------------
      # Same code, separate identity (com.ncan.privatecycle.nightly): a
      # standalone release build that installs alongside the stable app, so
      # features can be tried against imported real data without touching it.
      # `prebuild --clean` wipes android/, so the CI tuning, keystore and
      # codegen must be re-applied; ccache and the Gradle home keep this
      # second build cheap.
      - name: Prebuild nightly variant
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export ANDROID_VERSION_CODE=$(($(date +%s) / 60))
          APP_VARIANT=nightly npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle for CI (nightly)
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Decode release keystore (nightly)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Generate New Architecture codegen (nightly)
        working-directory: android
        run: ./gradlew generateCodegenArtifactsFromSchema

      - name: Build nightly APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --build-cache \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PMYAPP_RELEASE_STORE_FILE=release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Stage nightly APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dist/PrivateCycle-Nightly.apk

      # Both APKs built, so this commit becomes a public release. Re-resolve
      # the version right before publishing: it reuses this commit's tag on a
      # rerun, and skips versions another commit has claimed meanwhile.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          VERSION=$(node scripts/release-version.mjs)
          TAG="v$VERSION"
          echo "$VERSION" > dist/version.txt

          BUILT_VERSION="${{ steps.version.outputs.version }}"
          if [ "$VERSION" != "$BUILT_VERSION" ]; then
            echo "::warning::APKs carry v$BUILT_VERSION but this release is v$VERSION (stale rerun)"
          fi

          PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "Stable \`PrivateCycle.apk\` and nightly \`PrivateCycle-Nightly.apk\` (installs alongside the stable app, \`com.ncan.privatecycle.nightly\`) are both built from this version."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:'- %h %s — %an' "$PREV_TAG..HEAD"
            else
              git log --no-merges --pretty=format:'- %h %s — %an' HEAD
            fi
            echo
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
              echo
            fi
            echo "_Built from \`${GITHUB_SHA:0:7}\` on $(date -u '+%Y-%m-%d %H:%M UTC')._"
          } > changelog.md
          echo "----- changelog preview -----"
          cat changelog.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file changelog.md
            gh release upload "$TAG" dist/PrivateCycle.apk dist/PrivateCycle-Nightly.apk --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --notes-file changelog.md \
              dist/PrivateCycle.apk dist/PrivateCycle-Nightly.apk
          fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Cache diagnostics
        if: always()
        run: |
          du -sh .ccache 2>/dev/null || true
          ccache --show-stats 2>/dev/null || true
          if [ -f /tmp/ccache.log ]; then
            echo "--- build dir hashes seen by ccache ---"
            grep -oE '\.cxx/RelWithDebInfo/[a-z0-9]+' /tmp/ccache.log | sort -u | head
            echo "--- sample compiler invocation ---"
            grep -m1 -oE 'Command line: .*' /tmp/ccache.log | cut -c1-300 || true
          fi

      - name: Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f dist/version.txt ]; then
            VERSION=$(cat dist/version.txt)
          fi
          {
            echo "## CI"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
